<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Sustenance</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="styles.css" />
</head>

<body class="min-h-screen flex flex-col bg-background text-text">

    <!-- HEADER -->
    <header class="bg-primary text-white border-b-4 border-accent p-4">
        <h1 class="text-3xl font-bold">Student Sustenance</h1>
        <p class="text-background/80">Helping students find food and other resources on campus.</p>

        <nav class="mt-4">
            <ul class="flex gap-6">
                <li><a href="index.html" class="hover:text-accent">Home/Login</a></li>
                <li><a href="feed.html" class="hover:text-accent">Food Feed</a></li>
                <li><a href="about.html" class="hover:text-accent">About</a></li>
            </ul>
        </nav>
    </header>

    <!-- MAIN LOGIN CONTENT -->
    <main class="flex-grow flex items-center justify-center p-6">
        <section class="bg-white p-8 rounded shadow max-w-md w-full">
<h2 id="username-display" class="text-2xl font-semibold mb-4 text-primary">
    Login
</h2>

            <form method="post" action="feed.html" class="space-y-4">
                <div>
                    <label for="username" class="block font-medium">Username:</label>
                    <input type="text" id="username" name="username" required class="w-full border border-accent rounded p-2
              focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary" />
                </div>

                <div>
                    <label for="password" class="block font-medium">Password:</label>
                    <input type="password" id="password" name="password" required
                           class="w-full border border-accent rounded p-2" />
                </div>

                <button type="submit"
                        class="w-full bg-primary text-white p-2 rounded hover:bg-accent transition">
                    Login
                </button>
            </form>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="text-center p-6 bg-background text-text">
        <hr class="border-accent mb-4" />
        <span class="font-semibold">Josh Powell</span><br />
        <a href="https://github.com/powjosh04/startup/"
           class="text-primary hover:text-accent font-medium">
           GitHub
        </a>
    </footer>

</body>

</html>
